name: bicep-ado-deploy-infra

variables:
  - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
      # 'main' branch: PRD environment
      - template: ../../config-infra-prod.yml
  - ${{ if ne(variables['Build.SourceBranchName'], 'main') }}:
      # 'develop' or feature branches: DEV environment
      - template: ../../config-infra-dev.yml

trigger: none

pool:
  vmImage: $(ap_vm_image)

stages:
  - stage: Lint
    displayName: Lint and Preflight check
    jobs:
      - job: LintBicep
        displayName: Lint Bicep Code
        steps:
          - checkout: self
          - script: |
              az bicep build --file ./infrastructure/bicep/main.bicep
            name: LintBicepCode
            displayName: Run Bicep Linter

  - stage: PreflightValidation
    jobs:
      - job: ValidateBicepCode
        displayName: Validate Bicep Code
        steps:
          - task: AzureCli@2
            name: RunPreflightValidateion
            displayName: Run Preflight Validation
            inputs:
              azureSubscription: $(ado_service_connection_rg)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                # Resolve the pipeline service principal object id for RBAC (graceful fallback to empty)
                ADO_SP_OBJECT_ID=$(az ad sp show --id "$servicePrincipalId" --query id -o tsv 2>/dev/null || echo "")
                az deployment sub validate \
                  --name $(Build.DefinitionName) \
                  --template-file ./infrastructure/bicep/main.bicep \
                  --location $(location) \
                  --parameters \
                    location=$(location) \
                    prefix=$(namespace) \
                    postfix=$(postfix) \
                    env=$(environment) \
                    enableMonitoring=$(enable_monitoring) \
                    enableContainerRegistry=$(enable_container_registry) \
                    enableComputeCluster=$(enable_aml_computecluster) \
                    amlComputeSku='$(aml_compute_sku)' \
                    adoServicePrincipalId="$ADO_SP_OBJECT_ID" \
                    enableVNet=$(enable_vnet) \
                    vnetAddressPrefix='$(vnet_address_prefix)' \
                    defaultSubnetPrefix='$(default_subnet_prefix)' \
                    computeSubnetPrefix='$(compute_subnet_prefix)' \
                    peSubnetPrefix='$(pe_subnet_prefix)' \
                    tagCostCenter='$(tag_cost_center)' \
                    tagManagedBy='$(tag_managed_by)'

  - stage: CheckOutBicepAndDeploy
    displayName: Deploy AML Workspace
    jobs:
      - deployment: DevDeployBicep
        displayName: Deploy Bicep
        pool:
          vmImage: $(ap_vm_image)
        environment: $(environment)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: Running ${{ variables.environment }} Deployment
                  inputs:
                    azureSubscription: $(ado_service_connection_rg)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      az --version
                      # Resolve the pipeline service principal object id for RBAC (graceful fallback to empty)
                      ADO_SP_OBJECT_ID=$(az ad sp show --id "$servicePrincipalId" --query id -o tsv 2>/dev/null || echo "")
                      echo "deploying bicep..."
                      az deployment sub create \
                        --name $(Build.DefinitionName) \
                        --location $(location) \
                        --template-file ./infrastructure/bicep/main.bicep \
                        --parameters \
                          location=$(location) \
                          prefix=$(namespace) \
                          postfix=$(postfix) \
                          env=$(environment) \
                          enableMonitoring=$(enable_monitoring) \
                          enableContainerRegistry=$(enable_container_registry) \
                          enableComputeCluster=$(enable_aml_computecluster) \
                          amlComputeSku='$(aml_compute_sku)' \
                          adoServicePrincipalId="$ADO_SP_OBJECT_ID" \
                          enableVNet=$(enable_vnet) \
                          vnetAddressPrefix='$(vnet_address_prefix)' \
                          defaultSubnetPrefix='$(default_subnet_prefix)' \
                          computeSubnetPrefix='$(compute_subnet_prefix)' \
                          peSubnetPrefix='$(pe_subnet_prefix)' \
                          tagCostCenter='$(tag_cost_center)' \
                          tagManagedBy='$(tag_managed_by)'

